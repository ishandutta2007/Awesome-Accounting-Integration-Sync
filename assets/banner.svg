<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.85" />
    </linearGradient>

    <!-- Dynamic Flow Beam Gradient -->
    <linearGradient id="flowBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes syncPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #38bdf8); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 12px #10b981); }
    }

    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashMove 14s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 8 12;
      animation: dashMove 14s linear infinite reverse;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .center-logo-box {
      transform-origin: center;
      animation: syncPulse 4s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="110" r="140" fill="#6366f1" opacity="0.25" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1020" cy="310" r="160" fill="#10b981" opacity="0.22" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="600" cy="200" r="180" fill="#0284c7" opacity="0.18" class="pulsing-orb" filter="url(#glow)" />

  <!-- Animated Data Sync Waves & Flow Lines (Connecting Layers Behind Text) -->
  <g opacity="0.6">
    <path class="flow-line" d="M 50 140 C 300 80, 450 200, 600 140 C 750 80, 900 200, 1150 140" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="flow-line-reverse" d="M 50 280 C 300 340, 450 220, 600 280 C 750 340, 900 220, 1150 280" fill="none" stroke="#10b981" stroke-width="2.5" />
    <path class="flow-line" d="M 100 210 Q 600 320 1100 210" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="280" cy="80" r="3.5" fill="#38bdf8" class="particle" style="animation-delay: 0s;" />
  <circle cx="920" cy="120" r="4.5" fill="#10b981" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="220" cy="330" r="3" fill="#a855f7" class="particle" style="animation-delay: 2.2s;" />
  <circle cx="980" cy="340" r="4" fill="#38bdf8" class="particle" style="animation-delay: 0.8s;" />
  <circle cx="450" cy="60" r="3" fill="#6366f1" class="particle" style="animation-delay: 3s;" />

  <!-- Center Decorative Sync Icon Backdrop -->
  <g transform="translate(600, 75)" class="center-logo-box">
    <rect x="-42" y="-42" width="84" height="84" rx="22" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="2.5" />
    <!-- Sync / Exchange Icon -->
    <path d="M -16 -8 L 12 -8 L 5 -15 M 12 -8 L 5 -1" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 16 8 L -12 8 L -5 1 M -12 8 L -5 15" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Strictly Crisp, Legible, High Contrast -->
  
  <!-- Main Title -->
  <text x="600" y="195" text-anchor="middle" class="title-text" font-size="44" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    Awesome Accounting Integration &amp; Sync
  </text>
  
  <!-- Gradient Underline Accent -->
  <rect x="360" y="212" width="480" height="4" rx="2" fill="url(#primaryGlow)" />

  <!-- Subtitle -->
  <text x="600" y="255" text-anchor="middle" class="subtitle-text" font-size="20" fill="#94a3b8">
    The Definitive Directory of SaaS Platforms &amp; Open-Source Sync Engines
  </text>

  <!-- Feature / Topic Pills at Bottom -->
  <!-- Pill 1: CRM &amp; ERP Sync -->
  <g transform="translate(145, 305)">
    <rect width="190" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#6366f1" stroke-width="1.2" />
    <text x="95" y="24" text-anchor="middle" class="pill-text" fill="#c7d2fe">⚡ CRM to Accounting</text>
  </g>

  <!-- Pill 2: Bidirectional Sync -->
  <g transform="translate(355, 305)">
    <rect width="210" height="38" rx="19" fill="url(#badgeGrad3)" stroke="#0284c7" stroke-width="1.2" />
    <text x="105" y="24" text-anchor="middle" class="pill-text" fill="#bae6fd">🔄 Bidirectional Pipelines</text>
  </g>

  <!-- Pill 3: Double-Entry Ledgers -->
  <g transform="translate(585, 305)">
    <rect width="215" height="38" rx="19" fill="url(#badgeGrad2)" stroke="#10b981" stroke-width="1.2" />
    <text x="107" y="24" text-anchor="middle" class="pill-text" fill="#a7f3d0">📚 Double-Entry Ledgers</text>
  </g>

  <!-- Pill 4: AI &amp; Agent Sync -->
  <g transform="translate(820, 305)">
    <rect width="235" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="117" y="24" text-anchor="middle" class="pill-text" fill="#ddd6fe">🤖 Agentic MCP &amp; ELT APIs</text>
  </g>

  <!-- Bottom Tech Tags -->
  <text x="600" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" letter-spacing="1.2">
    QUICKBOOKS • NETSUITE • XERO • ZOHO • SAGE • AIRBYTE • MELTANO • ERPNEXT
  </text>
</svg>
